  <body>
    <!-- Netlify Forms detection: this static form registers "signup" at deploy time. -->
    <form name="signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>

    <div id="root"></div>

    <noscript>
      <div style="max-width:640px;margin:0 auto;padding:48px 20px;font-family:Georgia,serif;color:#3a2c20;background:#fbf8f0">
        <h1 style="color:#3f2a1c">The Family Almanac</h1>
        <p>Everything your home runs on, in one calm place — so no one has to hold it all in their head.</p>
        <form name="signup" method="POST" data-netlify="true">
          <input type="hidden" name="form-name" value="signup" />
          <label>Your email <input type="email" name="email" required /></label>
          <button type="submit">Send me the Almanac</button>
        </form>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
